name: data

# Refreshes mod data, publishes changed files to R2, and (when asked) rebuilds + deploys the site.
# Triggered by:
#  - the nightly schedule (always rebuilds, so pre-rendered mod pages stay fresh for search)
#  - the Cloudflare Worker cron (new release/snapshot -> rebuild; release-day refreshes -> data only)
#  - manual runs
on:
  schedule:
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild and deploy the site too
        type: boolean
        default: true

concurrency:
  group: data
  cancel-in-progress: false

env:
  MODRINTH_USER_AGENT: ${{ vars.MODRINTH_USER_AGENT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
  BUCKET: s3://mcmodsready-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # .cache/mods = per-mod support maps keyed by Modrinth's modified date (makes runs incremental)
      # .cache/published.json = hashes of what's in R2 (so only changed files are uploaded)
      - name: Restore pipeline cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: pipeline-${{ github.run_id }}
          restore-keys: pipeline-

      - name: API contract check
        run: npx tsx pipeline/contract.ts

      - name: Fetch previously published summary files
        run: |
          mkdir -p .prev
          for f in meta.json matrix-fabric.json matrix-neoforge.json matrix-forge.json; do
            aws s3 cp "$BUCKET/data/$f" ".prev/$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors || true
          done

      # A cold cache needs ~16k version lists (~1h). Cap per run so a first backfill spans two runs
      # comfortably inside the timeout; mods not fetched yet are looked up live by the site meanwhile.
      - name: Build data
        run: npx tsx pipeline/build-data.ts --max-fetch 12000 --out out/data

      - name: Save pipeline cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: pipeline-${{ github.run_id }}

      - name: Guard
        run: npx tsx pipeline/guard.ts .prev out/data

      - name: Publish changed files to R2
        run: |
          npx tsx pipeline/stage-changed.ts out/data out/stage/data .cache/published.json
          if [ -n "$(ls -A out/stage/data)" ]; then
            aws s3 sync out/stage/data "$BUCKET/data" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          fi
          while IFS= read -r f; do
            [ -n "$f" ] && aws s3 rm "$BUCKET/data/$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done < out/stage/deleted.txt

      - name: Save published manifest
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: pipeline-${{ github.run_id }}-published

      - name: Daily snapshot (history)
        if: github.event_name == 'schedule'
        run: |
          day=$(date -u +%F)
          for f in meta.json matrix-fabric.json matrix-neoforge.json matrix-forge.json stats-fabric.json stats-neoforge.json stats-forge.json; do
            aws s3 cp "out/data/$f" "$BUCKET/snapshots/$day/$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ github.event.client_payload.rebuild }}" = "true" ] \
            || [ "${{ inputs.rebuild }}" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.decide.outputs.rebuild == 'true'
        run: npm run build
        env:
          DATA_DIR: out/data
          PUBLIC_DATA_BASE: /data
          PUBLIC_HOST_CTA: ${{ vars.PUBLIC_HOST_CTA }}
          PUBLIC_KOFI_URL: ${{ vars.PUBLIC_KOFI_URL }}

      - name: Deploy Worker + static site
        if: steps.decide.outputs.rebuild == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
