name = "mcmodsready-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Fill in once the domain is on Cloudflare. The static site itself is served by Cloudflare Pages;
# this Worker only takes /data/* and /go/* on the same hostname.
routes = [
  { pattern = "mcmodsready.com/data/*", zone_name = "mcmodsready.com" },
  { pattern = "mcmodsready.com/go/*", zone_name = "mcmodsready.com" },
]

[triggers]
crons = ["*/10 * * * *"]

[[r2_buckets]]
binding = "DATA"
bucket_name = "mcmodsready-data"

[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[analytics_engine_datasets]]
binding = "CLICKS"
dataset = "mcmodsready_clicks"

[vars]
GITHUB_REPO = "Baldilocks47/mcmodsready"
# Partner name -> affiliate URL. Example: {"host":"https://partner.example/?ref=abc"}
AFFILIATES = "{}"

# Secrets (set with `npx wrangler secret put GITHUB_TOKEN`):
#   GITHUB_TOKEN  fine-grained PAT, this repo only, permission "Contents: read and write"
